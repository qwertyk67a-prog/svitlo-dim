name: Check DTEK schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: dtek-outage-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate BOT_ENABLED on the runner
        id: gate
        shell: bash
        env:
          CONFIGURED_BOT_ENABLED: ${{ vars.BOT_ENABLED }}
        run: |
          if [[ "$CONFIGURED_BOT_ENABLED" =~ ^[[:space:]]*true[[:space:]]*$ ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "BOT_ENABLED is exactly true; continuing with DTEK"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::BOT_ENABLED is not accessible as exactly true to this workflow"
              exit 1
            fi
            echo "BOT_ENABLED is off; no Telegram calls will run"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.active == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.gate.outputs.active == 'true'
        run: pip install -r requirements.txt
      - name: Verify installed dependency compatibility
        if: steps.gate.outputs.active == 'true'
        run: python -m pip check
      - name: Cache Chromium for DTEK WAF fallback
        if: steps.gate.outputs.active == 'true'
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt', 'constraints.txt') }}
      - name: Install Chromium on cache miss
        if: steps.gate.outputs.active == 'true' && steps.chromium-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Read DTEK and notify Telegram
        if: steps.gate.outputs.active == 'true'
        id: notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DTEK_GROUP: ${{ vars.DTEK_GROUP || '6.2' }}
          REMINDER_MINUTES: ${{ vars.REMINDER_MINUTES || '0' }}
          DTEK_WAF_BROWSER: "1"
          ANNOUNCEMENTS_ENABLED: ${{ vars.ANNOUNCEMENTS_ENABLED || 'true' }}
          DTEK_ADDRESS_JSON: ${{ secrets.DTEK_ADDRESS_JSON }}
          STATE_PATH: bot_state.json
        run: python bot.py --once
      - name: Save notification state even if later notifications fail
        if: always() && steps.gate.outputs.active == 'true' && steps.notify.outcome != 'skipped'
        env:
          GITHUB_STATE_PUSH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f bot_state.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f bot_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Store notification state [skip ci]"
              # Do not persist the write-capable GitHub token in checkout.
              # Only the state-saving step receives this token.
              cat > "$RUNNER_TEMP/svitlo-askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' 'x-access-token' ;;
            *Password*) printf '%s' "$GITHUB_STATE_PUSH_TOKEN" ;;
          esac
          ASKPASS
              chmod 700 "$RUNNER_TEMP/svitlo-askpass"
              # Retry non-fast-forward races with ordinary code commits.
              # A conflicting state edit is a hard error, never overwritten.
              for attempt in 1 2 3; do
                if GIT_ASKPASS="$RUNNER_TEMP/svitlo-askpass" GIT_TERMINAL_PROMPT=0 \
                  git push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:main; then
                  exit 0
                fi
                if [[ "$attempt" == 3 ]]; then
                  echo "State push failed after 3 attempts" >&2
                  exit 1
                fi
                GIT_ASKPASS="$RUNNER_TEMP/svitlo-askpass" GIT_TERMINAL_PROMPT=0 \
                  git fetch "https://github.com/$GITHUB_REPOSITORY.git" main
                git rebase FETCH_HEAD || {
                  git rebase --abort || true
                  echo "State merge conflict; refusing to discard notifications" >&2
                  exit 1
                }
              done
            fi
          fi
