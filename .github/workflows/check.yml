name: Check power schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: power-outage-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate BOT_ENABLED on the runner
        id: gate
        shell: bash
        env:
          CONFIGURED_BOT_ENABLED: ${{ secrets.BOT_ENABLED || vars.BOT_ENABLED }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production Telegram delivery is allowed only on main"
            exit 1
          fi
          if [[ "$CONFIGURED_BOT_ENABLED" =~ ^[[:space:]]*true[[:space:]]*$ ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "BOT_ENABLED is exactly true; continuing with configured operator"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::BOT_ENABLED is not accessible as exactly true to this workflow"
              exit 1
            fi
            echo "BOT_ENABLED is off; no Telegram calls will run"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.active == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.gate.outputs.active == 'true'
        run: pip install -r requirements.txt
      - name: Verify installed dependency compatibility
        if: steps.gate.outputs.active == 'true'
        run: python -m pip check
      - name: Cache Chromium for provider browser fallback
        if: steps.gate.outputs.active == 'true'
        id: chromium-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt', 'constraints.txt') }}
      - name: Install Chromium on cache miss
        if: steps.gate.outputs.active == 'true' && steps.chromium-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Load notification state from isolated branch
        if: steps.gate.outputs.active == 'true'
        id: load_state
        env:
          REPOSITORY_STATE_TOKEN: ${{ github.token }}
          REPOSITORY_STATE_BRANCH: bot-state
          POWER_CONFIG_JSON: ${{ secrets.POWER_CONFIG_JSON }}
          STATE_PATH: bot_state.json
        run: python -m scripts.repo_state load
      - name: Read configured source and notify Telegram
        if: steps.gate.outputs.active == 'true'
        id: notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEEKLY_SCHEDULE_MODE: ${{ vars.WEEKLY_SCHEDULE_MODE || 'off' }}
          TELEGRAM_SCHEDULE_BOARD: "true"
          REMINDER_MINUTES: ${{ secrets.REMINDER_MINUTES || vars.REMINDER_MINUTES || '0' }}
          ANNOUNCEMENTS_ENABLED: ${{ secrets.ANNOUNCEMENTS_ENABLED || vars.ANNOUNCEMENTS_ENABLED || 'true' }}
          POWER_CONFIG_JSON: ${{ secrets.POWER_CONFIG_JSON }}
          STATE_PATH: bot_state.json
        run: python bot.py --once
      - name: Schedule pin confirmed
        if: always() && steps.gate.outputs.active == 'true' && steps.notify.outputs.pin_health == 'ok'
        run: echo "Telegram confirmed the schedule pin"
      - name: Schedule pin failed
        if: always() && steps.gate.outputs.active == 'true' && steps.notify.outputs.pin_health == 'failed'
        run: echo "::warning::Telegram schedule pin could not be confirmed"
      - name: Save notification state to isolated branch
        if: always() && steps.gate.outputs.active == 'true' && steps.load_state.outcome == 'success' && steps.notify.outcome != 'skipped'
        env:
          REPOSITORY_STATE_TOKEN: ${{ github.token }}
          REPOSITORY_STATE_BRANCH: bot-state
          POWER_CONFIG_JSON: ${{ secrets.POWER_CONFIG_JSON }}
          STATE_PATH: bot_state.json
        run: python -m scripts.repo_state save
