name: Compare source daily and weekly tables
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: chromium-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt','constraints.txt') }}
      - if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Compare official tables for each verified queue
        env:
          POWER_CONFIG_JSON: ${{ secrets.POWER_CONFIG_JSON }}
        run: python -m scripts.verify_source_tables
