name: Verify weekly Telegram delivery once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/weekly-delivery-check.yml']
permissions:
  contents: read
jobs:
  delivery:
    if: github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Verify one weekly message in the configured group
        env:
          GATE: ${{ secrets.BOT_ENABLED || vars.BOT_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POWER_CONFIG_JSON: ${{ secrets.POWER_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          from datetime import datetime, timedelta
          import requests
          from alerts import fetch_address_status
          from bot import KYIV, compact_forecast_day, verified_week
          from house_reliability import verified_house_queues
          from power_config import address_json, provider_config
          from provider_transport import get_schedule

          async def render():
              house = await fetch_address_status(address_json())
              groups = verified_house_queues(house.group_ids if house else None)
              if len(groups) != 1:
                  raise SystemExit("Expected one confirmed queue")
              source = await get_schedule(provider_config())
              week = verified_week(source, groups[0])
              if week is None:
                  raise SystemExit("Weekly table incomplete")
              today = datetime.now(KYIV).date()
              monday = today - timedelta(days=today.weekday())
              return "\n\n".join(compact_forecast_day(monday + timedelta(days=i), spans)
                                 for i, spans in enumerate(week))

          if os.environ["GATE"].strip().lower() != "true":
              raise SystemExit("Delivery disabled")
          text = asyncio.run(render())
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"].strip() + "/sendMessage"
          chat = os.environ["TELEGRAM_CHAT_ID"].strip()
          for attempt in range(2):
              try:
                  body = requests.post(url, json={"chat_id": chat, "text": text,
                                       "disable_notification": True}, timeout=25).json()
              except (requests.RequestException, ValueError):
                  raise SystemExit("Telegram response unavailable") from None
              if body.get("ok"):
                  result = body["result"]
                  if str(result["chat"]["id"]) != str(chat) or result["text"] != text:
                      raise SystemExit("Returned chat or text differs")
                  print("Telegram confirmed weekly message", result["message_id"], "with seven date blocks")
                  break
              migration = body.get("parameters", {}).get("migrate_to_chat_id")
              if attempt or not migration:
                  raise SystemExit("Telegram rejected message: " + str(body.get("error_code")))
              chat = migration
          PY
