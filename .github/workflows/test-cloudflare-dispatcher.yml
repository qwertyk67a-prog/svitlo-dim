name: Test Cloudflare dispatcher and independent watchdog
on:
  push:
    branches: [main, feature/cloudflare-independent-watchdog-20261122]
    paths:
      - deploy/cloudflare-dispatcher/**
      - .github/workflows/test-cloudflare-dispatcher.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run native JavaScript regression tests without Secrets
        run: |
          node --version
          cd deploy/cloudflare-dispatcher
          node --test tests/*.test.mjs
      - name: Verify safe default: dispatch enabled and watchdog disabled
        run: |
          grep -q '^ENABLED = "true"$' deploy/cloudflare-dispatcher/wrangler.toml
          grep -q '^WATCHDOG_ENABLED = "false"$' deploy/cloudflare-dispatcher/wrangler.toml
