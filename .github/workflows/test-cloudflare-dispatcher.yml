name: Test Cloudflare dispatcher and independent watchdog
on:
  pull_request:
    branches: [main]
  push:
    paths:
      - deploy/cloudflare-dispatcher/**
      - .github/workflows/test-cloudflare-dispatcher.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run native JavaScript regression tests without Secrets
        run: |
          node --version
          cd deploy/cloudflare-dispatcher
          node --test tests/*.test.mjs
      - name: Dry-run Cloudflare Worker bundle without deployment or Secrets
        env:
          WORKER_INSTALLATION_JSON: >-
            {"worker":"synthetic-worker","namespace":"00000000000000000000000000000001","repository":"${{ github.repository }}"}
        run: node deploy/cloudflare-dispatcher/deploy.mjs --dry-run
