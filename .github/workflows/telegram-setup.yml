name: Connect Telegram bot (manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover: read /chatid in group; test: send one test message"
        type: choice
        required: true
        default: discover
        options:
          - discover
          - test
permissions:
  contents: read
jobs:
  telegram-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify bot and group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SETUP_MODE: ${{ inputs.mode }}
        run: python -m scripts.telegram_setup
