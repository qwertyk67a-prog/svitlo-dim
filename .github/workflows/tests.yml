name: Python tests
on:
  push:
    paths:
      - bot.py
      - house_reliability.py
      - alerts.py
      - event_scope.py
      - requirements.txt
      - .github/workflows/check.yml
      - .github/workflows/audit-dry-run.yml
      - constraints.txt
      - .github/dependabot.yml
      - tests/**
      - .github/workflows/tests.yml
      - .github/workflows/telegram-setup.yml
      - scripts/telegram_setup.py
      - scripts/telegram_diagnose.py
      - .github/workflows/telegram-diagnose.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest PyYAML
      - run: python -m pip check
      - name: Report whether repository activation variable is visible
        env:
          CONFIGURED_BOT_ENABLED: ${{ vars.BOT_ENABLED }}
        run: |
          python - <<'PY'
          import os
          value = os.environ.get("CONFIGURED_BOT_ENABLED", "")
          stripped = value.strip()
          print("ACTIVATION_DIAGNOSTIC: nonempty =", bool(value))
          print("ACTIVATION_DIAGNOSTIC: exact_true =", value == "true")
          print("ACTIVATION_DIAGNOSTIC: trimmed_true =", stripped == "true")
          print("ACTIVATION_DIAGNOSTIC: casefold_true =", stripped.casefold() == "true")
          print("ACTIVATION_DIAGNOSTIC: quoted_true =", stripped.strip(chr(34) + chr(39)) == "true")
          print("ACTIVATION_DIAGNOSTIC: length =", len(value))
          print("ACTIVATION_DIAGNOSTIC: leading_or_trailing_whitespace =", value != stripped)
          print("ACTIVATION_DIAGNOSTIC: contains_nonascii =", not value.isascii())
          PY
      - run: python -m pytest -q tests/
