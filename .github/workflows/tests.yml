name: Python tests
on:
  pull_request:
    branches: [main]
  push:
    paths:
      - source_registry.py
      - optional_schedules.py
      - scripts/replay_schedule.py
      - bot.py
      - schedule_board.py
      - power_config.py
      - provider_transport.py
      - mapped_provider.py
      - scripts/verify_address.py
      - scripts/repo_state.py
      - scripts/migrate_checkpoint.py
      - scripts/state_crypto.py
      - scripts/monitor_health.py
      - scripts/preflight_migration.py
      - .github/workflows/preflight-migration.yml
      - .github/workflows/monitor-health.yml
      - .github/workflows/migrate-checkpoint.yml
      - deploy/cloudflare-dispatcher/**
      - scripts/verify_source_tables.py
      - .github/workflows/verify-address.yml
      - .github/workflows/verify-source-tables.yml
      - house_reliability.py
      - alerts.py
      - event_scope.py
      - requirements.txt
      - .github/workflows/check.yml
      - .github/workflows/audit-dry-run.yml
      - constraints.txt
      - .github/dependabot.yml
      - tests/**
      - .github/workflows/tests.yml
      - .github/workflows/telegram-setup.yml
      - scripts/telegram_setup.py
      - scripts/telegram_diagnose.py
      - .github/workflows/telegram-diagnose.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest PyYAML
      - run: python -m pip check
      - run: python -m pytest -q tests/
