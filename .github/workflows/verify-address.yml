name: Verify configured address (no Telegram)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-address:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check queues without posting messages
        env:
          POWER_CONFIG_JSON: ${{ secrets.POWER_CONFIG_JSON }}
        run: python -m scripts.verify_address
