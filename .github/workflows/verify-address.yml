name: Verify DTEK house address (no Telegram)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-address:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check queues without posting messages
        env:
          DTEK_ADDRESS_JSON: ${{ secrets.DTEK_ADDRESS_JSON }}
        run: python scripts/verify_address.py
