name: Verify encrypted migrated checkpoint (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read and validate encrypted notification checkpoint without Telegram
        env:
          POWER_CONFIG_JSON: ${{ secrets.POWER_CONFIG_JSON }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY_STATE_TOKEN: ${{ github.token }}
          REPOSITORY_STATE_BRANCH: bot-state
          STATE_PATH: verify_state.json
        run: python -m scripts.verify_migrated_checkpoint
