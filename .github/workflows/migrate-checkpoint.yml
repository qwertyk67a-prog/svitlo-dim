name: Migrate notification checkpoint (no Telegram)
on:
  push:
    branches: [feature/provider-independent-template-20261120]
    paths:
      - release/migrate-trigger.txt
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type MIGRATE after disabling BOT_ENABLED'
        required: true
        type: string
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require reviewed feature branch
        env:
          CHECKED_OUT_REF: ${{ github.ref }}
        run: |
          if [[ "$CHECKED_OUT_REF" != "refs/heads/feature/provider-independent-template-20261120" ]]; then
            echo "::error::Select reviewed feature branch, not main"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrate old state into isolated branch
        env:
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          # The one-time push trigger is created only after the owner
          # explicitly disables BOT_ENABLED. The script independently checks
          # that variable and refuses a nonempty target branch.
          CONFIRM_MIGRATION: ${{ github.event_name == 'push' && 'MIGRATE' || inputs.confirmation }}
          REPOSITORY_STATE_TOKEN: ${{ github.token }}
          REPOSITORY_STATE_BRANCH: bot-state
          POWER_CONFIG_JSON: ${{ secrets.POWER_CONFIG_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_PATH: bot_state.json
        run: python -m scripts.migrate_checkpoint
