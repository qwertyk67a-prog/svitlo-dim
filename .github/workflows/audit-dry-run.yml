name: Dry-run DTEK audit (no Telegram)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-dry-run.yml
      - alerts.py
      - bot.py
      - event_scope.py
      - house_reliability.py
      - requirements.txt
      - constraints.txt
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: chromium-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt', 'constraints.txt') }}
      - if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Read DTEK and simulate decisions without Telegram
        env:
          DTEK_ADDRESS_JSON: ${{ secrets.DTEK_ADDRESS_JSON }}
          ANNOUNCEMENTS_ENABLED: ${{ vars.ANNOUNCEMENTS_ENABLED || 'true' }}
          REMINDER_MINUTES: ${{ vars.REMINDER_MINUTES || '0' }}
          DTEK_WAF_BROWSER: "1"
          DRY_RUN: "true"
          STATE_PATH: bot_state.json
        run: python bot.py --once
